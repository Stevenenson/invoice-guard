<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1F6B"/>
      <stop offset="1" stop-color="#17113F"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C5CF5"/>
    </linearGradient>
    <clipPath id="card"><rect x="800" y="62" width="400" height="236" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="220" fill="#6C4CF1" opacity="0.18"/>
  <circle cx="980" cy="380" r="160" fill="#6C4CF1" opacity="0.12"/>

  <!-- logo + title -->
  <path d="M96 92 L124 120 L96 148 L68 120 Z" fill="url(#gem)"/>
  <text x="146" y="138" font-size="54" font-weight="700" fill="#FFFFFF">InvoiceGuard</text>
  <text x="70" y="200" font-size="26" fill="#DDD6FE">Verifică facturile din SPV înainte să le plătești</text>
  <text x="70" y="234" font-size="18" fill="#A5A0C8">ANAF live · IBAN schimbat · firme-clonă · dubluri · totul local</text>

  <!-- verdict pills -->
  <g font-size="17" font-weight="600">
    <rect x="70" y="270" width="124" height="38" rx="19" fill="#FDE2E2"/>
    <circle cx="94" cy="289" r="6" fill="#DC2626"/>
    <text x="108" y="295" fill="#B91C1C">Blocată</text>

    <rect x="206" y="270" width="176" height="38" rx="19" fill="#FEF3C7"/>
    <circle cx="230" cy="289" r="6" fill="#D97706"/>
    <text x="244" y="295" fill="#92400E">De reverificat</text>

    <rect x="394" y="270" width="140" height="38" rx="19" fill="#DCFCE7"/>
    <circle cx="418" cy="289" r="6" fill="#16A34A"/>
    <text x="432" y="295" fill="#166534">Verificată</text>
  </g>

  <!-- invoice card -->
  <g filter="url(#shadow)">
    <rect x="800" y="62" width="400" height="236" rx="18" fill="#FFFFFF"/>
  </g>
  <rect x="800" y="62" width="6" height="236" fill="#DC2626" clip-path="url(#card)"/>
  <text x="830" y="104" font-size="20" font-weight="700" fill="#1F2937">ORANGE ROMANIA SA</text>
  <text x="830" y="130" font-size="15" fill="#6B7280">ORN-7790002 · 1.210,00 lei</text>
  <rect x="1078" y="86" width="98" height="28" rx="14" fill="#FDE2E2"/>
  <circle cx="1096" cy="100" r="5" fill="#DC2626"/>
  <text x="1108" y="105" font-size="14" font-weight="600" fill="#B91C1C">Blocată</text>

  <line x1="830" y1="150" x2="1176" y2="150" stroke="#EEF0F4" stroke-width="2"/>

  <g font-size="15">
    <circle cx="840" cy="176" r="10" fill="#FDE2E2"/>
    <path d="M835 171 L845 181 M845 171 L835 181" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <text x="860" y="181" fill="#B91C1C" font-weight="600">IBAN diferit de cel din contract</text>

    <circle cx="840" cy="212" r="10" fill="#DCFCE7"/>
    <path d="M835 212 L839 216 L846 207" stroke="#16A34A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="860" y="217" fill="#374151">Firmă activă la ANAF · plătitoare de TVA</text>

    <circle cx="840" cy="248" r="10" fill="#DCFCE7"/>
    <path d="M835 248 L839 252 L846 243" stroke="#16A34A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="860" y="253" fill="#374151">Factura există în SPV</text>
  </g>
  <text x="830" y="282" font-size="13" fill="#6C4CF1" font-weight="600">risc 50/100 · Sunați la numărul din contract</text>
</svg>
