<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>InvoiceGuard</title>
  <style>
    body { margin: 0; width: 360px; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #26323f; }
    header { background: #2b1f6b; color: #fff; padding: 12px 14px; font-weight: 700; font-size: 15px; }
    header span { color: #b9a8ff; }
    section { padding: 12px 14px; border-bottom: 1px solid #eee; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #c9cfd8; flex: none; }
    .dot.on { background: #2e8b57; } .dot.off { background: #d92d20; }
    .muted { color: #6a7888; font-size: 12px; margin: 6px 0 0; line-height: 1.4; }
    button { font: inherit; border: 1px solid #6c4cf1; background: #6c4cf1; color: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
    button.ghost { background: #fff; color: #5a3be0; }
    textarea { width: 100%; box-sizing: border-box; height: 180px; margin-top: 8px; font: 11px ui-monospace, Menlo, monospace; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    code { background: #f1eefe; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <header><span>◆</span> InvoiceGuard</header>
  <section>
    <div class="status"><span class="dot" id="dot"></span><b id="api-status">Verific API-ul…</b></div>
    <p class="muted" id="api-help"></p>
  </section>
  <section>
    <b>Diagnostic pagină</b>
    <p class="muted">Arată ce tabele găsește add-on-ul pe pagina deschisă. Dacă coloana „Verificare” nu apare în SAGA WEB, copiați raportul și trimiteți-l echipei.</p>
    <div class="row"><button id="diag">Diagnostic</button><button class="ghost" id="copy" hidden>Copiază</button></div>
    <textarea id="out" readonly hidden></textarea>
  </section>
  <script src="popup.js"></script>
</body>
</html>
